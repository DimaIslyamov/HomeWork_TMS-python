{% extends "core/base.html" %}

{% block title %}Delete comment{% endblock %}

{% block content %}
    <section class="delete-confirmation">
        <h1>Delete comment</h1>

        <p>Are you sure you want to delete this comment?</p>

        <blockquote>
            {{ object.content }}
        </blockquote>

        <form method="post">
            {% csrf_token %}

            <button type="submit" class="button button-danger">
                Delete
            </button>

            <a href="{{ object.post.get_absolute_url }}" class="button button-secondary">
                Cancel
            </a>
        </form>
    </section>
{% endblock %}
