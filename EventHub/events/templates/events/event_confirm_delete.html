{% extends "base.html" %}

{% block title %}Delete {{ object.title }} | EventHub{% endblock %}

{% block content %}
    <section class="panel form-panel">
        <p class="eyebrow">Confirm delete</p>
        <h1 class="confirm-title">Delete event</h1>
        <p class="lead">Are you sure you want to delete "{{ object.title }}"? This action cannot be undone.</p>

        <form method="post">
            {% csrf_token %}
            <div class="form-actions">
                <button class="button button-danger" type="submit">Delete</button>
                <a class="button button-ghost" href="{{ object.get_absolute_url }}">Cancel</a>
            </div>
        </form>
    </section>
{% endblock %}
