{% extends "core/base.html" %}

{% block title %}Posts{% endblock %}

{% block content %}
    <h1>Posts</h1>

    {% for post in posts %}
    <h2>
        <a href="{% url 'posts:post_detail' post.pk %}">
            {{ post.title }}
        </a>
    </h2>
{% empty %}
    <p>No posts yet.</p>
{% endfor %}

{% endblock %}
