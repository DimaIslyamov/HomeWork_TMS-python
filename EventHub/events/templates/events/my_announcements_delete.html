{% extends "base.html" %}

{% block title %}Delete Announcement | EventHub{% endblock %}

{% block content %}
    <section class="panel form-panel">
        <p class="eyebrow">Confirm delete</p>
        <h1 class="confirm-title">Delete announcement</h1>
        <p class="lead">Are you sure you want to delete this announcement?</p>

        <div class="announcement-summary">
            <h2>{{ object.title }}</h2>
            <p>{{ object.description }}</p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="form-actions">
                <button class="button button-danger" type="submit">Delete</button>
                <a class="button button-ghost" href="{% url 'events:announcements_list' event_id=object.event_id %}">Cancel</a>
            </div>
        </form>
    </section>
{% endblock %}
