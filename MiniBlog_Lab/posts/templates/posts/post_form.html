{% extends "core/base.html" %}

{% block title %}Create post{% endblock %}

{% block content %}
    <h1>Create post</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Save</button>
    </form>

    <p>
        <a href="{% url 'posts:post_list' %}">Back to posts</a>
    </p>
{% endblock %}
