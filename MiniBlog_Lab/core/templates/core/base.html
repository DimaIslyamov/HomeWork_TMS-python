{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MiniBlog{% endblock %} | MiniBlog Lab</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="{% url 'core:home' %}">MiniBlog Lab</a>

            <nav class="site-nav" aria-label="Main navigation">
                <a href="{% url 'core:home' %}">Home</a>
                <a href="{% url 'posts:post_list' %}">Posts</a>
                <a href="{% url 'core:about' %}">About</a>
                <a href="{% url 'core:contacts' %}">Contacts</a>
                {% if user.is_authenticated %}
                    <span class="nav-user">{{ user.username }}</span>
                    <form class="nav-logout-form" method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button class="nav-link-button" type="submit">Logout</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}">Login</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="site-main">
        <div class="container">
            {% block content %}
            {% endblock %}
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>MiniBlog Lab. Django CRUD practice project.</p>
        </div>
    </footer>
</body>
</html>
