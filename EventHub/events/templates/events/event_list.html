<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>
        {% if category %}
            Events in {{ category.title }}
        {% else %}
            {{ page_title }}
        {% endif %}
    </title>
</head>
<body>
    {% if category %}
        <h1>Events in {{ category.title }}</h1>
    {% else %}
        <h1>{{ page_title }}</h1>
    {% endif %}

    {% for event in events %}
        <h2>
            <a href="{{ event.get_absolute_url }}">
                {{ event.title }}
            </a>
        </h2>

        <p>
            Category:
            <a href="{% url 'events:events_by_category' event.category_id %}">
                {{ event.category.title }}
            </a>
        </p>

    {% empty %}
        <p>No published events.</p>
    {% endfor %}

    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Logout</button>
    </form>

    <a href="{% url 'events:event_about' %}">About</a>
</body>
</html>
