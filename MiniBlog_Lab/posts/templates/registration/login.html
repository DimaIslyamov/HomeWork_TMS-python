{% extends "core/base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
    <section class="form-panel">
        <h1>Login</h1>

        <form method="post" class="post-form">
            {% csrf_token %}

            {{ form.as_p }}

            <div class="form-actions">
                <button class="button button-primary" type="submit">Login</button>
            </div>
        </form>
    </section>
{% endblock %}
