<h1>Request Demo</h1>

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Send request
    </button>
</form>

{% if student_name and course_name %}
    <h2>Request received</h2>

    <p>Student: {{ student_name }}</p>
    <p>Course: {{ course_name }}</p>
{% endif %}
